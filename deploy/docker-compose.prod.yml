# Karibu POS — production-style stack (load balanced)
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Topology:
#   nginx  ──load-balances──▶  app1 / app2 / app3   (stateless Gunicorn)
#                                     │
#                       ┌────────────┴────────────┐
#                    postgres                    redis
#            (durable data)          (shared rate-limit + token cache)
#
#   scheduler = a SINGLE extra app instance that runs the billing sweep, so
#   dunning/renewal jobs fire exactly once regardless of replica count.
#
# Why this is safe to scale horizontally:
#   - The app holds no in-process session state (JWT is stateless).
#   - Rate limiting uses Redis, so a limit means the same thing on every replica.
#   - Billing mutations are guarded by row locks + a DB unique index, so even
#     with many replicas a charge can't be applied twice.

x-app-env: &app-env
  ENV: production
  DATABASE_URL: postgresql://karibu:${DB_PASSWORD:-karibu}@postgres:5432/karibu_pos
  RATELIMIT_STORAGE_URI: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
  FORCE_HTTPS: "true"

  # Email is REQUIRED in production — signup emails a 6-digit code and login is
  # blocked until it's confirmed, so the app refuses to boot without a working
  # transport. `:?` fails the compose run up front with a clear message rather
  # than letting the containers crash-loop.
  #
  # Sends from karibupos@gmail.com over Brevo's HTTPS API. The sender address
  # must be verified under Brevo -> Senders first, or every send returns 400.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
  EMAIL_API_KEY: ${EMAIL_API_KEY:?set EMAIL_API_KEY (Brevo xkeysib-… key)}
  EMAIL_FROM: ${EMAIL_FROM:-Karibu POS <karibupos@gmail.com>}
  # Only read when EMAIL_PROVIDER=smtp. Outbound SMTP is open on a VPS, so this
  # stack can fall back to it — but then EMAIL_FROM must match SMTP_USER.
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-karibupos@gmail.com}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

  # Paystack collects the M-Pesa subscription payments. sk_test_… exercises the
  # flow without moving money; the app refuses to boot in production if this is
  # empty, because an empty key silently simulates every charge.
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?set PAYSTACK_SECRET_KEY (sk_test_… or sk_live_…)}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
  # Leave empty: Paystack's published egress IPs can change, and a stale list
  # 403s every real webhook. The HMAC signature is the actual authentication.
  PAYSTACK_WEBHOOK_ALLOWED_IPS: ${PAYSTACK_WEBHOOK_ALLOWED_IPS:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karibu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karibu}
      POSTGRES_DB: karibu_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karibu"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  # --- Migrations run once before the app replicas start -------------------
  migrate:
    build: ../karibu-backend
    command: alembic upgrade head
    environment:
      <<: *app-env
      ENABLE_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- App replicas (load balanced, scheduler OFF) -------------------------
  app1: &app
    build: ../karibu-backend
    command: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 3 --bind 0.0.0.0:8000 --timeout 60
    environment:
      <<: *app-env
      ENABLE_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped

  app2:
    <<: *app

  app3:
    <<: *app

  # --- Scheduler: exactly ONE instance runs the billing sweep --------------
  scheduler:
    build: ../karibu-backend
    command: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:8000
    environment:
      <<: *app-env
      ENABLE_SCHEDULER: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped

  # --- Edge: TLS termination + load balancing ------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

volumes:
  pgdata:
