# Karibu POS — Nginx reverse proxy + load balancer
#
# Sits in front of N Gunicorn app instances. Responsibilities:
#   - Distribute traffic across app replicas (load balancing)
#   - Terminate TLS (HTTPS) and force secure transport
#   - Add a first layer of rate limiting and request-size limits
#   - Pass the real client IP through so the app's limiter/logging is accurate
#
# This is a template — replace server_name and certificate paths for your host.

# --- Upstream pool: the app replicas ---------------------------------------
# 'least_conn' sends each request to the replica with the fewest active
# connections, which suits variable-latency API calls better than round-robin.
upstream karibu_api {
    least_conn;
    server app1:8000 max_fails=3 fail_timeout=15s;
    server app2:8000 max_fails=3 fail_timeout=15s;
    server app3:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# --- Rate limiting zones (edge layer) --------------------------------------
# Coarse per-IP limits at the edge; the app enforces finer per-route limits.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.karibupos.co.ke;   # <-- change me

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # <-- change me
    ssl_certificate_key /etc/nginx/certs/privkey.pem;     # <-- change me
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (belt-and-braces with the app's) -----------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # --- Request limits ----------------------------------------------------
    client_max_body_size 2m;         # reject oversized bodies early
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn conn_per_ip 20;       # cap concurrent connections per IP

    # --- Auth endpoints: strict limiting -----------------------------------
    location ~ ^/api/auth/(login|register) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://karibu_api;
        include /etc/nginx/proxy_params.conf;
    }

    # --- M-Pesa callback: no rate limit (Safaricom bursts) -----------------
    location ~ ^/api/billing/callback/ {
        proxy_pass http://karibu_api;
        include /etc/nginx/proxy_params.conf;
    }

    # --- Everything else ---------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://karibu_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Health check (no logging noise).
    location = /api/health {
        access_log off;
        proxy_pass http://karibu_api;
        include /etc/nginx/proxy_params.conf;
    }
}
