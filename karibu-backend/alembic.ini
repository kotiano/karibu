# Alembic configuration for Karibu POS.
#
# The database URL is NOT set here — it's read from the app settings
# (DATABASE_URL env var) inside alembic/env.py, so migrations always use the
# same database as the app. Run:
#
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
