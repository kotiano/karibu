<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Karibu POS</title>
<style>
  :root { --green:#005C39; --ink:#1A1C1B; --muted:#5B615D; --paper:#FBFAF6; --line:#E7E4DA; }
  body { margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { max-width:440px; padding:40px 28px; }
  .brand { font-weight:700; font-size:22px; color:var(--green); }
  .rule { width:44px; height:3px; background:#F97316; border-radius:2px; margin:8px 0 24px; }
  h1 { font-size:26px; margin:0 0 8px; letter-spacing:-0.4px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.doc { display:block; padding:16px 18px; margin-bottom:12px; border:1px solid var(--line);
          border-radius:12px; background:#fff; color:var(--ink); text-decoration:none; font-weight:600; }
  a.doc span { display:block; font-weight:400; font-size:14px; color:var(--muted); margin-top:2px; }
  footer { margin-top:28px; font-size:14px; color:var(--muted); }
  footer a { color:var(--green); }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#ECEAE3; --muted:#A8ADA8; --paper:#141613; --line:#2C302C; }
    a.doc { background:#1C1F1C; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Karibu POS</div>
    <div class="rule"></div>
    <h1>Legal</h1>
    <p>Restaurant point of sale, built for Kenya.</p>
    <a class="doc" href="./privacy.html">Privacy Policy
      <span>Effective 22nd July 2026</span></a>
    <a class="doc" href="./terms.html">Terms &amp; Conditions
      <span>Effective 22nd July 2026</span></a>
    <footer><a href="mailto:karibupos@gmail.com">karibupos@gmail.com</a></footer>
  </div>
</body>
</html>
